<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Importados Filati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,800;1,700;1,800&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: capa roxa com tiras de tecido que abrem ao toque → barra de filtro fixa → vitrine de looks → ficha e modo apresentação */
:root{
  --roxo:#4b1463; --roxo-2:#3a0f4d; --laranja:#f25100; --magenta:#cc1e7e; --turquesa:#12aec0; --amarelo:#f5ae00;
  --bg:#f7f4f8; --card:#ffffff; --fg:#22142b; --muted:#6d6177; --line:#e4dce9; --chip:#efe8f3; --chip-fg:#3a0f4d;
  --display:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#160a1d; --card:#21122a; --fg:#f3ecf6; --muted:#b4a6bd; --line:#3a2846; --chip:#2e1b3a; --chip-fg:#f3ecf6; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#160a1d; --card:#21122a; --fg:#f3ecf6; --muted:#b4a6bd; --line:#3a2846; --chip:#2e1b3a; --chip-fg:#f3ecf6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
/* capa */
.capa{background:var(--roxo);color:#fff;position:relative;overflow:hidden}
.capa .wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px;padding-block:28px 36px;align-items:end}
.capa-top{display:flex;justify-content:space-between;align-items:center;grid-column:1/-1}
.capa-top img{height:30px;width:auto}
.capa-top span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.capa h1{font-family:var(--display);font-weight:800;font-style:italic;font-size:clamp(44px,7vw,88px);line-height:.92;margin:0;letter-spacing:-.02em;text-wrap:balance}
.capa h1 em{display:block;font-style:italic;color:var(--amarelo)}
.capa p{max-width:34ch;margin:18px 0 0;opacity:.9}
.capa .nums{display:flex;gap:28px;margin-top:24px;font-variant-numeric:tabular-nums}
.capa .nums b{display:block;font-size:28px;font-weight:800;line-height:1}
.capa .nums small{font-size:12px;opacity:.75}
.tiras{display:flex;gap:6px;height:420px;min-width:0}
.tira{flex:1;min-width:0;border-radius:14px;overflow:hidden;position:relative;cursor:pointer;transition:flex .5s cubic-bezier(.2,.8,.2,1);border:0;padding:0;background:#000}
.tira.aberta{flex:6}
.tira img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .45s}
.tira .look{opacity:0;object-position:top}
.tira.aberta .look{opacity:1}
.tira .rot{position:absolute;left:12px;right:12px;bottom:10px;color:#fff;text-align:left;opacity:0;transition:opacity .3s .15s;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.tira.aberta .rot{opacity:1}
.rot b{display:block;font-style:italic;font-weight:800;font-size:20px;line-height:1.1}
.rot small{font-size:12px}
.tira:focus-visible{outline:3px solid var(--amarelo);outline-offset:2px}
/* filtros */
.filtros{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.filtros .wrap{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-block:12px}
.grupo{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip i{font-style:normal;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--roxo);border-color:var(--roxo);color:#fff}
.chip[aria-pressed="true"] i{color:#e9d9f2}
.chip:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--laranja);outline-offset:2px}
.busca{margin-left:auto;display:flex;gap:8px;align-items:center}
.busca input{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 14px;width:220px;max-width:100%}
.btn{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;background:var(--laranja);color:#fff;white-space:nowrap}
.btn.sec{background:var(--chip);color:var(--chip-fg)}
/* vitrine */
.cab{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:22px 6px}
.cab h2{margin:0;font-size:20px;font-weight:600}
.cab span{color:var(--muted);font-size:13px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;padding-block:8px 48px}
.card{background:var(--card);border-radius:16px;overflow:hidden;cursor:pointer;border:1px solid var(--line);display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit;padding:0;transition:transform .2s}
.card:hover{transform:translateY(-3px)}
.card:focus-visible{outline:3px solid var(--laranja);outline-offset:2px}
.foto{position:relative;aspect-ratio:3/4;background:#fff;max-width:100%}
.foto img.look{width:100%;height:100%;object-fit:cover;object-position:top}
.foto .amostra{position:absolute;right:10px;bottom:10px;width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--card);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.foto .tipo{position:absolute;left:10px;top:10px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--roxo);color:#fff;padding:3px 9px;border-radius:999px}
.foto .tipo.tp{background:var(--turquesa)}
.info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.info .cod{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.info h3{margin:0;font-size:18px;font-weight:800;font-style:italic;line-height:1.15}
.info .comp{font-size:13px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--chip-fg)}
.vazio{grid-column:1/-1;padding:48px 0;text-align:center;color:var(--muted)}
/* ficha */
dialog{border:0;padding:0;border-radius:18px;max-width:min(1100px,calc(100vw - 32px));width:100%;background:var(--card);color:var(--fg);max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(20,6,28,.7)}
.ficha{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.ficha .slide{background:#fff;display:flex;align-items:center}
.ficha .slide img{width:100%;height:auto;display:block}
.ficha .dados{padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0;overflow:auto}
.ficha h3{margin:0;font-size:26px;font-weight:800;font-style:italic;line-height:1.1}
.spec{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.spec dt{color:var(--muted)} .spec dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums}
.ficha ul{margin:0;padding-left:18px;font-size:14px}
.acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.fechar{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:20px;cursor:pointer;z-index:2}
.aviso{font-size:12px;color:var(--muted);min-height:1em}
/* apresentação */
.palco{position:fixed;inset:0;background:#0d0512;z-index:20;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.palco .barra{display:flex;justify-content:space-between;align-items:center;color:#fff;padding-block:10px;gap:12px;font-size:13px}
.palco .tela{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;touch-action:pan-y}
.palco .tela img{max-width:100%;max-height:100%;border-radius:8px}
.palco .nav{display:flex;justify-content:center;gap:10px;padding-block:12px}
.rodape{background:var(--roxo-2);color:#fff}
.rodape .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;padding-block:24px;font-size:13px}
.rodape img{height:24px;width:auto}
.rodape p{margin:0;opacity:.85;user-select:all}
@media (max-width:820px){
  .capa .wrap{grid-template-columns:minmax(0,1fr)}
  .tiras{height:300px}
  .ficha{grid-template-columns:minmax(0,1fr)}
  .busca{margin-left:0;width:100%} .busca input{flex:1;width:auto;min-width:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="capa">
  <div class="wrap">
    <div class="capa-top"><img src="img/logo-branco.png" alt="Filati Malhas"><span>Catálogo · Outubro 2026</span></div>
    <div>
      <h1>Importados <em>Filati</em></h1>
      <p>Malhas e tecidos planos que chegam de fora para a sua coleção. Toque num tecido e veja a roupa que ele vira.</p>
      <div class="nums" id="nums"></div>
    </div>
    <div class="tiras" id="tiras" role="list"></div>
  </div>
</header>

<nav class="filtros" aria-label="Filtros">
  <div class="wrap">
    <div class="grupo" id="f-seg" role="group" aria-label="Segmento"></div>
    <div class="grupo" id="f-tipo" role="group" aria-label="Tipo"></div>
    <div class="busca">
      <input id="q" type="search" placeholder="Buscar por nome, código ou fio" aria-label="Buscar">
      <button class="btn" id="apresentar" type="button">Apresentar</button>
    </div>
  </div>
</nav>

<main class="wrap">
  <div class="cab"><h2 id="titulo">Todos os artigos</h2><span id="conta"></span></div>
  <div class="grade" id="grade"></div>
</main>

<footer class="rodape">
  <div class="wrap">
    <img src="img/logo-branco.png" alt="Filati Malhas">
    <p>WhatsApp (85) 99952-9286</p>
    <p>@filatimalhas</p>
    <p>Av. Bernardo Manuel, 9970, Itaperi · Fortaleza/CE</p>
  </div>
</footer>

<dialog id="ficha" aria-label="Ficha do artigo"></dialog>
<div class="palco" id="palco" hidden></div>

<script src="artigos.js"></script>
<script>
const A = (window.ARTIGOS || []).slice().sort((a,b)=>a.codigo.localeCompare(b.codigo));
const SEGS = ["Moda","Fitness","Lingerie","Praia","Alfaiataria","Casual"];
const est = { seg:null, tipo:null, q:"" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const img = (c, k) => `img/${c}-${k}.jpg`;

// capa
$("#nums").innerHTML = [
  [A.length, "artigos"],
  [A.filter(a=>a.tipo==="Malha").length, "malhas"],
  [A.filter(a=>a.tipo!=="Malha").length, "tecidos planos"]
].map(([n,t])=>`<div><b>${n}</b><small>${t}</small></div>`).join("");
const vitrine = ["8006","8027","8037","8018","8008","8026","8032"].map(c=>A.find(a=>a.codigo===c)).filter(Boolean);
$("#tiras").innerHTML = vitrine.map((a,i)=>`
  <button class="tira${i===0?" aberta":""}" role="listitem" data-c="${a.codigo}" aria-label="${esc(a.nome)}">
    <img src="${img(a.codigo,"tec")}" alt=""><img class="look" src="${img(a.codigo,"look")}" alt="">
    <span class="rot"><b>${esc(a.nome)}</b><small>${esc(a.composicao||"")}</small></span>
  </button>`).join("");
$("#tiras").addEventListener("click", e => {
  const t = e.target.closest(".tira"); if (!t) return;
  if (t.classList.contains("aberta")) { abrir(t.dataset.c); return; }
  document.querySelectorAll(".tira").forEach(x=>x.classList.toggle("aberta", x===t));
});
document.querySelectorAll(".tira").forEach(t=>t.addEventListener("mouseenter",()=>{
  document.querySelectorAll(".tira").forEach(x=>x.classList.toggle("aberta", x===t));
}));

// filtros
function filtrados(ignora){
  const q = est.q.trim().toLowerCase();
  return A.filter(a =>
    (ignora==="seg" || !est.seg || (a.segmentos||[]).includes(est.seg)) &&
    (ignora==="tipo" || !est.tipo || a.tipo===est.tipo) &&
    (!q || [a.codigo,a.nome,a.composicao,(a.destaques||[]).join(" ")].join(" ").toLowerCase().includes(q)));
}
function chips(){
  const bs = filtrados("seg");
  $("#f-seg").innerHTML = [["Todos",null,bs.length], ...SEGS.map(s=>[s,s,bs.filter(a=>(a.segmentos||[]).includes(s)).length])]
    .filter(([,,n],i)=>i===0||n>0)
    .map(([t,v,n])=>`<button class="chip" type="button" data-seg="${v??""}" aria-pressed="${est.seg===v}">${t}<i>${n}</i></button>`).join("");
  const bt = filtrados("tipo");
  $("#f-tipo").innerHTML = [["Malha e plano",null],["Malha","Malha"],["Tecido plano","Tecido plano"]]
    .map(([t,v])=>`<button class="chip" type="button" data-tipo="${v??""}" aria-pressed="${est.tipo===v}">${t}<i>${v?bt.filter(a=>a.tipo===v).length:bt.length}</i></button>`).join("");
}
$("#f-seg").addEventListener("click",e=>{const b=e.target.closest(".chip"); if(!b)return; est.seg=b.dataset.seg||null; render();});
$("#f-tipo").addEventListener("click",e=>{const b=e.target.closest(".chip"); if(!b)return; est.tipo=b.dataset.tipo||null; render();});
$("#q").addEventListener("input",e=>{est.q=e.target.value; render();});

function render(){
  chips();
  const L = filtrados();
  $("#titulo").textContent = [est.seg, est.tipo].filter(Boolean).join(" · ") || "Todos os artigos";
  $("#conta").textContent = `${L.length} ${L.length===1?"artigo":"artigos"}`;
  $("#grade").innerHTML = L.length ? L.map(a=>`
    <button class="card" type="button" data-c="${a.codigo}">
      <div class="foto">
        <img class="look" loading="lazy" src="${img(a.codigo,"look")}" alt="Roupas feitas com ${esc(a.nome)}">
        <span class="tipo${a.tipo==="Malha"?"":" tp"}">${a.tipo==="Malha"?"Malha":"Plano"}</span>
        <img class="amostra" loading="lazy" src="${img(a.codigo,"tec")}" alt="">
      </div>
      <div class="info">
        <span class="cod">${a.codigo}${a.gramatura?` · ${a.gramatura} g/m²`:""}</span>
        <h3>${esc(a.nome)}</h3>
        <span class="comp">${esc(a.composicao||"")}</span>
        <div class="tags">${(a.segmentos||[]).map(s=>`<span class="tag">${s}</span>`).join("")}</div>
      </div>
    </button>`).join("") : `<p class="vazio">Nenhum artigo com esses filtros. Tire um filtro ou mude a busca.</p>`;
}
$("#grade").addEventListener("click",e=>{const c=e.target.closest(".card"); if(c) abrir(c.dataset.c);});

// ficha
const dlg = $("#ficha");
let atual = null;
function abrir(cod){
  const a = A.find(x=>x.codigo===cod); if(!a) return; atual = a;
  const L = filtrados(); const i = L.indexOf(a);
  const lin = (k,v)=> v ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : "";
  dlg.innerHTML = `<button class="fechar" type="button" aria-label="Fechar">×</button>
    <div class="ficha">
      <div class="slide"><img src="${img(a.codigo,"slide")}" alt="Página do catálogo: ${esc(a.nome)}"></div>
      <div class="dados">
        <div><span class="cod" style="color:var(--muted);font-size:13px">${a.codigo} · ${a.tipo}</span><h3>${esc(a.nome)}</h3></div>
        <dl class="spec">${lin("Composição",a.composicao)}${lin("Gramatura",a.gramatura&&a.gramatura+" g/m²")}${lin("Largura",a.largura)}${lin("Rendimento",a.rendimento)}${lin("Cores",a.n_cores&&a.n_cores+" na cartela")}</dl>
        ${(a.destaques||[]).length?`<ul>${a.destaques.map(d=>`<li>${esc(d)}</li>`).join("")}</ul>`:""}
        <div class="tags">${(a.segmentos||[]).map(s=>`<span class="tag">${s}</span>`).join("")}</div>
        <div class="acoes">
          <button class="btn sec" type="button" data-ir="-1" ${i<=0?"disabled":""}>‹ Anterior</button>
          <button class="btn sec" type="button" data-ir="1" ${i<0||i>=L.length-1?"disabled":""}>Próximo ›</button>
          <button class="btn" type="button" id="copiar">Copiar texto para o cliente</button>
        </div>
        <p class="aviso" id="aviso"></p>
      </div>
    </div>`;
  if(!dlg.open) dlg.showModal();
}
dlg.addEventListener("click",e=>{
  if(e.target===dlg || e.target.closest(".fechar")) return dlg.close();
  const ir = e.target.closest("[data-ir]");
  if(ir){ const L=filtrados(); const a=L[L.indexOf(atual)+Number(ir.dataset.ir)]; if(a) abrir(a.codigo); }
  if(e.target.id==="copiar"){
    const a=atual;
    const t=`${a.nome} (${a.codigo}) · Filati\n${a.composicao||""}${a.gramatura?` · ${a.gramatura} g/m²`:""}${a.largura?` · largura ${a.largura}`:""}\nIndicado para: ${(a.segmentos||[]).join(", ")}`;
    const ok=()=>$("#aviso").textContent="Texto copiado. Cole no WhatsApp do cliente.";
    try{ navigator.clipboard.writeText(t).then(ok,()=>{$("#aviso").textContent=t;}); }catch{ $("#aviso").textContent=t; }
  }
});

// apresentação: as páginas do catálogo em tela cheia, na ordem do filtro
const palco = $("#palco"); let pi = 0, PL = [];
function mostra(){
  const a = PL[pi];
  palco.innerHTML = `<div class="barra"><span>${pi+1} de ${PL.length} · ${esc(a.nome)}</span><button class="btn sec" type="button" data-sair>Sair</button></div>
    <div class="tela"><img src="${img(a.codigo,"slide")}" alt="${esc(a.nome)}"></div>
    <div class="nav"><button class="btn sec" type="button" data-p="-1">‹ Anterior</button><button class="btn" type="button" data-p="1">Próximo ›</button></div>`;
}
$("#apresentar").addEventListener("click",()=>{ PL=filtrados(); if(!PL.length) return; pi=0; mostra(); palco.hidden=false; palco.requestFullscreen?.().catch(()=>{}); });
function passo(d){ pi=(pi+d+PL.length)%PL.length; mostra(); }
function sair(){ palco.hidden=true; if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }
palco.addEventListener("click",e=>{ if(e.target.closest("[data-sair]")) sair(); const p=e.target.closest("[data-p]"); if(p) passo(Number(p.dataset.p)); });
document.addEventListener("keydown",e=>{ if(palco.hidden) return; if(e.key==="ArrowRight") passo(1); if(e.key==="ArrowLeft") passo(-1); if(e.key==="Escape") sair(); });
let x0=null; palco.addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});
palco.addEventListener("touchend",e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>50) passo(dx<0?1:-1); x0=null; });

render();
</script>

</body>
</html>
